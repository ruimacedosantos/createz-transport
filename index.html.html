<body>
  <div class="container">
    <h1>CREATEZ</h1>
    <p class="sub">Transportanfrage – Partner &amp; Interne Aufträge</p>
    <div class="info">
      <h2>Proof of Concept</h2>
      <p>CREATEZ verarbeitet Transportanfragen über eine zentrale API-Schnittstelle.</p>
      <p>Dieses Formular nutzt dieselbe Route wie alle angebundenen Partner.</p>
    </div>
    <form id="form">
      <div>
        <label>Referenz / Auftraggeber</label>
        <input id="ref" placeholder="z.B. CREATEZ-2026-001" required>
      </div>
      <div class="row">
        <div><label>Abholung PLZ</label><input id="plz1" placeholder="58095" required></div>
        <div><label>Lieferung PLZ</label><input id="plz2" placeholder="44135" required></div>
      </div>
      <div class="row">
        <div><label>Früheste Abholung</label><input id="pickup" type="datetime-local" required></div>
        <div><label>Späteste Lieferung</label><input id="delivery" type="datetime-local" required></div>
      </div>
      <div><label>Anmerkungen</label><textarea id="notes" rows="3" placeholder="Hinweise..."></textarea></div>
      <button type="submit">Anfrage senden</button>
    </form>
    <div id="msg"></div>
    <footer>CREATEZ GmbH · CRZ Ledger API · Proof of Concept 2026</footer>
  </div>
  <script>
    document.getElementById("form").addEventListener("submit", async function(e) {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.className = "info"; msg.textContent = "Wird gesendet...";
      try {
        const res = await fetch("https://api.createz.de/api/transport-requests", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-API-Key": "crz-live-key" },
          body: JSON.stringify({
            clientReference: document.getElementById("ref").value,
            pickupPostalCode: document.getElementById("plz1").value,
            deliveryPostalCode: document.getElementById("plz2").value,
            earliestPickup: new Date(document.getElementById("pickup").value).toISOString(),
            latestDelivery: new Date(document.getElementById("delivery").value).toISOString(),
            notes: document.getElementById("notes").value || ""
          })
        });
        if (res.status === 201) {
          const d = await res.json();
          msg.className = "ok"; msg.textContent = "✓ Anfrage eingegangen. ID: " + d.requestId;
          document.getElementById("form").reset();
        } else {
          const err = await res.json().catch(()=>({}));
          msg.className = "err"; msg.textContent = "Fehler: " + (err.error || res.status);
        }
      } catch(e) {
        msg.className = "err"; msg.textContent = "Server nicht erreichbar – bitte später erneut versuchen.";
      }
    });
  </script>
